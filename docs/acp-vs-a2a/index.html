<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP vs A2A — 协议时序交互对照</title>
<style>
  :root {
    /* show-me 纸张与墨黑体系 */
    --paper: #FDFDFB;
    --paper-2: #F6F5F0;
    --surface: #FFFFFF;
    --surface-subtle: #F6F5F0;
    --surface-hover: #F2F0E8;
    --ink: #151B29;
    --ink-2: #3D4350;
    --ink-3: #7C8494;
    --line: #E8E5DD;
    --line-strong: #D5D1C7;

    /* 粉彩语义色板 */
    --blue-100: #EAF3F8;
    --blue-200: #D0E8F8;
    --blue-300: #B8D8F8;
    --blue-500: #3888F8;
    --blue-deep: #1D58B8;

    --red-100: #FDECEB;
    --red-200: #F8D0D0;
    --red-300: #F4B4B0;
    --red-500: #F04840;
    --red-deep: #B9322B;

    --yellow-100: #FEF9E7;
    --yellow-200: #F8E8B8;
    --yellow-300: #F8E080;
    --yellow-deep: #8A5308;

    --green-100: #EAF8F0;
    --green-200: #C8F0D8;
    --green-500: #2FA866;
    --green-deep: #1E7A48;

    /* 语义别名 */
    --acp: var(--blue-500);
    --acp-deep: var(--blue-deep);
    --acp-soft: var(--blue-100);
    --acp-200: var(--blue-200);
    --acp-border: var(--blue-300);

    --a2a: var(--red-500);
    --a2a-deep: var(--red-deep);
    --a2a-soft: var(--red-100);
    --a2a-200: var(--red-200);
    --a2a-border: var(--red-300);

    --human: var(--yellow-deep);
    --human-soft: var(--yellow-100);
    --human-200: var(--yellow-200);
    --human-border: #E8CF84;

    --code-bg: #141A28;
    --code-surface: #1B2234;
    --code-border: #283249;
    --code-text: #EDF2F7;
    --code-muted: #8E9AB2;

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 22px;

    --shadow: 0 1px 0 rgba(21, 27, 41, .03), 0 18px 40px -30px rgba(21, 27, 41, .42);
    --topbar-h: 88px;

    --font-title: "Yuanti SC", "Hannotate SC", "HanziPen SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: "PingFang SC", "Hiragino Sans GB", "Yuanti SC", "Microsoft YaHei", sans-serif;
    --font-marker: "Marker Felt", "Chalkboard SE", "Hannotate SC", "Yuanti SC", sans-serif;
    --mono: "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  ::selection {
    background: var(--blue-300);
    color: var(--ink);
  }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-numeric: tabular-nums;
  }

  /* show-me 标志性 24px 浅墨点阵纸底纹 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(21, 27, 41, .14) .65px, transparent .65px);
    background-size: 24px 24px;
    opacity: .16;
  }

  button {
    font-family: inherit;
    color: inherit;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2.5px solid var(--blue-500);
    outline-offset: 2px;
  }

  /* Custom scrollbars */
  .ins-body,
  .code-scroll {
    scrollbar-width: thin;
    scrollbar-color: rgba(21, 27, 41, .22) transparent;
  }
  .code-scroll {
    scrollbar-color: rgba(142, 154, 178, .35) transparent;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
  ::-webkit-scrollbar-thumb {
    background: rgba(21, 27, 41, .2);
    border-radius: 999px;
    min-height: 20px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(21, 27, 41, .38); }
  .ins-body::-webkit-scrollbar { width: 4px; }
  .ins-body::-webkit-scrollbar-track { margin: 28px 0; }
  .code-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .code-scroll::-webkit-scrollbar-track { margin: 0 18px; }
  .code-scroll::-webkit-scrollbar-thumb { background: rgba(142, 154, 178, .35); }
  .code-scroll::-webkit-scrollbar-thumb:hover { background: rgba(142, 154, 178, .6); }

  /* 荧光笔高亮 */
  .hl {
    background: linear-gradient(180deg, transparent 54%, var(--accent-border, var(--blue-300)) 54%, var(--accent-border, var(--blue-300)) 92%, transparent 92%);
    padding: 0 .14em;
    font-weight: 800;
    color: var(--ink);
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(253, 253, 251, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1.5px dashed var(--line);
  }

  .topbar-inner {
    max-width: 1680px;
    margin: 0 auto;
    padding: 13px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand h1 {
    margin: 0;
    font-family: var(--font-title);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.2;
  }

  .brand h1 .en {
    display: inline-block;
    font-family: var(--font-marker);
    font-weight: 400;
    transform: rotate(-1.5deg);
    letter-spacing: .01em;
  }

  .brand h1 .en.acp-word { color: var(--blue-500); }
  .brand h1 .en.a2a-word { color: var(--red-500); }

  .brand h1 .vs {
    font-family: var(--font-marker);
    font-weight: 400;
    font-size: 0.78em;
    color: var(--ink-3);
    margin: 0 2px;
  }

  .brand h1 .marker {
    position: relative;
    z-index: 0;
    display: inline-block;
    padding: 0 .1em;
    margin-left: 4px;
  }

  .brand h1 .marker::after {
    content: "";
    position: absolute;
    left: -.04em;
    right: -.04em;
    bottom: .06em;
    height: .28em;
    z-index: -1;
    border-radius: 999px;
    background: var(--blue-300);
    transform: rotate(-1deg);
  }

  /* 便签黄任务条 */
  .task-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    line-height: 1.35;
    color: var(--ink);
    background: var(--yellow-200);
    border: 1.5px solid var(--ink);
    border-radius: 10px 14px 10px 12px;
    padding: 4px 12px;
    transform: rotate(-0.6deg);
    box-shadow: 2px 3px 0 rgba(21, 27, 41, .08);
  }

  .task-pill strong {
    color: var(--ink);
    font-weight: 800;
  }

  .brand-hint {
    margin: 0;
    font-size: 12px;
    color: var(--ink-3);
  }

  .brand-hint kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    background: #fff;
    border: 1.5px solid var(--ink);
    border-bottom-width: 2.5px;
    border-radius: 5px;
    padding: 0 5px;
    color: var(--ink);
  }

  /* Mode switcher — 墨黑描边粉彩药丸 */
  .tabs {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    background: var(--paper-2);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    flex-shrink: 0;
  }

  .tabs button {
    border: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-title);
    font-size: 13px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 999px;
    color: var(--ink-2);
    transition: transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    white-space: nowrap;
  }

  .tabs button:hover:not(.on) {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.7);
  }

  .tabs button .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    flex-shrink: 0;
  }

  .tabs button[data-tab="acp"] .dot { background: var(--blue-500); }
  .tabs button[data-tab="a2a"] .dot { background: var(--red-500); }
  .tabs button[data-tab="compare"] .dot {
    background: linear-gradient(135deg, var(--blue-500) 50%, var(--red-500) 50%);
  }

  .tabs button.on {
    border-color: var(--ink);
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(21, 27, 41, .12);
    transform: translateY(-1px);
  }

  .tabs button[data-tab="acp"].on { background: var(--blue-200); }
  .tabs button[data-tab="a2a"].on { background: var(--red-200); }
  .tabs button[data-tab="compare"].on { background: var(--yellow-200); }

  /* ── Main container ── */
  main {
    position: relative;
    z-index: 1;
    max-width: 1680px;
    margin: 0 auto;
    padding: 22px 28px 80px;
  }

  /* ── Protocol view shell ── */
  .proto-view {
    --accent: var(--blue-500);
    --accent-deep: var(--blue-deep);
    --accent-soft: var(--blue-100);
    --accent-200: var(--blue-200);
    --accent-border: var(--blue-300);
  }

  .proto-view.a2a {
    --accent: var(--red-500);
    --accent-deep: var(--red-deep);
    --accent-soft: var(--red-100);
    --accent-200: var(--red-200);
    --accent-border: var(--red-300);
  }

  .proto-view[hidden],
  .compare-view[hidden] {
    display: none;
  }

  /* Intro banner (mental model) */
  .intro-strip {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr);
    gap: 22px;
    align-items: center;
  }

  .intro-main {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .intro-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .proto-badge {
    font-family: var(--font-marker);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .04em;
    color: var(--ink);
    background: var(--accent-200);
    border: 2px solid var(--ink);
    padding: 2px 11px;
    border-radius: 999px;
    transform: rotate(-1.5deg);
    box-shadow: 2px 2px 0 rgba(21, 27, 41, .08);
  }

  .intro-main h2 {
    margin: 0;
    font-family: var(--font-title);
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -0.01em;
  }

  .intro-meta {
    font-size: 11.5px;
    color: var(--ink-2);
    font-family: var(--mono);
    background: var(--paper-2);
    border: 1px solid var(--line);
    padding: 2px 9px;
    border-radius: 999px;
  }

  .mental-model {
    margin: 2px 0 0;
    font-size: 14.5px;
    color: var(--ink-2);
    line-height: 1.75;
  }

  .mental-model strong {
    color: var(--ink);
    font-weight: 800;
  }

  .intro-facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-left: 22px;
    border-left: 1.5px dashed var(--line);
  }

  .fact {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--paper-2);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 9px 12px;
  }

  .fact-label {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ink-3);
  }

  .fact-val {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.45;
  }

  /* ── Two-column workspace ── */
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(410px, 490px);
    gap: 26px;
    align-items: start;
  }

  /* ── Left: Sequence board (show-me 手绘描边大画板) ── */
  .seq-board {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: var(--radius-lg);
    box-shadow: 6px 8px 0 var(--accent-soft);
    overflow: clip;
  }

  /* Stepper toolbar */
  .seq-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1.5px dashed var(--line);
    background: var(--paper-2);
    flex-wrap: wrap;
  }

  .legend-inline {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    flex-wrap: wrap;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-line {
    width: 18px;
    height: 0;
    border-top: 2.5px solid var(--accent);
    border-radius: 999px;
    display: inline-block;
  }

  .legend-line.dashed {
    border-top-style: dashed;
    border-top-color: var(--ink-2);
  }

  .legend-line.human {
    border-top-color: var(--yellow-deep);
  }

  .legend-line.host {
    border-top-color: var(--green-500);
  }

  .stepper {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .step-btn {
    border: 1.5px solid var(--ink);
    background: #fff;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background .14s ease, transform .14s ease, box-shadow .14s ease;
  }

  .step-btn:hover:not(:disabled) {
    background: var(--accent-200);
    transform: translateY(-1px);
    box-shadow: 2px 2px 0 rgba(21, 27, 41, .1);
  }

  .step-btn:disabled {
    opacity: .35;
    border-color: var(--line-strong);
    color: var(--ink-3);
    cursor: not-allowed;
  }

  .step-counter {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-2);
    min-width: 56px;
    text-align: center;
  }

  /* Swimlane header */
  .lane-header {
    position: sticky;
    top: var(--topbar-h);
    z-index: 15;
    display: grid;
    grid-template-columns: 132px 1fr 132px;
    align-items: center;
    padding: 13px 16px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1.5px dashed var(--line);
  }

  .actor-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 10px;
    border-radius: 14px;
    background: var(--paper-2);
    border: 2px solid var(--ink);
    box-shadow: 3px 4px 0 var(--line);
  }

  .actor-box.agent {
    background: var(--accent-200);
    border-color: var(--ink);
    box-shadow: 3px 4px 0 var(--accent-soft);
  }

  .actor-name {
    font-family: var(--font-title);
    font-size: 13px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.25;
  }

  .actor-role {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
    margin-top: 1px;
  }

  .lane-mid-hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-3);
  }

  /* Diagram body with continuous vertical rails */
  .diagram-body {
    position: relative;
    padding: 6px 0 20px;
  }

  .rails {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .rail-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1.8px dashed rgba(21, 27, 41, .26);
  }

  /* Aligned to center of 132px actor boxes inside 16px horizontal padding: 16 + 66 = 82px */
  .rail-line.left { left: 82px; }
  .rail-line.right { right: 82px; }

  /* Phase / section divider */
  .phase {
    position: relative;
    z-index: 2;
    padding-top: 10px;
  }

  .phase-header {
    position: relative;
    z-index: 3;
    margin: 12px 16px 8px;
    padding: 11px 15px;
    background: var(--paper-2);
    border: 1.5px dashed var(--line-strong);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px 12px;
    flex-wrap: wrap;
  }

  .phase.branch .phase-header {
    background: var(--yellow-100);
    border-color: var(--human-border);
    border-style: dashed;
  }

  .phase-title-group {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
  }

  /* show-me 圆号角标 */
  .phase-no {
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    background: var(--accent);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    display: inline-grid;
    place-items: center;
    line-height: 1;
    flex-shrink: 0;
    box-shadow: 1.5px 2px 0 rgba(21, 27, 41, .14);
  }

  .phase.branch .phase-no {
    background: var(--yellow-300);
    color: var(--ink);
  }

  .phase-title {
    margin: 0;
    font-family: var(--font-title);
    font-size: 15px;
    font-weight: 900;
    color: var(--ink);
  }

  .phase-tag {
    font-size: 11px;
    font-weight: 800;
    padding: 2px 9px;
    border-radius: 999px;
    color: var(--ink);
    background: var(--yellow-200);
    border: 1.5px solid var(--ink);
  }

  .phase-desc {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-2);
    flex-basis: 100%;
    padding-left: 35px;
  }

  .phase.branch .phase-desc {
    color: var(--yellow-deep);
  }

  /* Interactive scenario switcher for ACP extended flows */
  .phase.scenarios .phase-header {
    background: var(--blue-100);
    border: 1.5px dashed var(--blue-500);
    flex-direction: column;
    align-items: stretch;
    gap: 11px;
  }

  .phase-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .phase.scenarios .phase-tag {
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--ink);
  }

  .scenario-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }

  .scenario-pill {
    border: 1.5px solid var(--line-strong);
    background: #fff;
    color: var(--ink-2);
    border-radius: 999px;
    padding: 5px 12px;
    font-family: var(--font-title);
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease;
  }

  .scenario-pill:hover:not(.on) {
    border-color: var(--ink);
    color: var(--ink);
    transform: translateY(-1px);
  }

  .scenario-pill.on {
    background: var(--blue-200);
    border: 2px solid var(--ink);
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(21, 27, 41, .12);
    transform: translateY(-1px);
  }

  .scenario-count {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 800;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--ink-2);
  }

  .scenario-pill.on .scenario-count {
    background: #fff;
    color: var(--ink);
    border: 1px solid rgba(21, 27, 41, .16);
  }

  .scenario-brief {
    margin: 0;
    padding: 9px 13px;
    border-radius: 12px;
    background: #fff;
    border: 1.5px solid var(--ink);
    box-shadow: 2px 3px 0 rgba(21, 27, 41, .06);
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.6;
  }

  .scenario-brief strong {
    color: var(--ink);
  }

  .scenario-brief code {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    background: var(--yellow-200);
    color: var(--ink);
    padding: 1px 5px;
    border-radius: 5px;
  }

  /* Message step row */
  .step-row {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) 82px;
    align-items: stretch;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 0;
    text-align: left;
    cursor: pointer;
  }

  .step-row:hover .msg-card {
    border-color: var(--ink);
    transform: translateY(-1px);
    box-shadow: 2px 3px 0 rgba(21, 27, 41, .08);
  }

  .step-row.paired .msg-card {
    border: 2px dashed var(--accent);
    background: var(--accent-soft);
  }

  .step-row.active .msg-card {
    border: 2px solid var(--ink);
    background: var(--accent-soft);
    box-shadow: 3px 4px 0 var(--accent-200);
  }

  .step-row.is-human .msg-card {
    border-color: var(--human-border);
    background: var(--yellow-100);
  }

  .step-row.is-human.active .msg-card {
    border: 2px solid var(--ink);
    background: var(--yellow-200);
    box-shadow: 3px 4px 0 rgba(21, 27, 41, .12);
  }

  .step-row.is-host .msg-card {
    border-color: #A5DFBD;
    background: var(--green-100);
  }

  .step-row.is-host.active .msg-card {
    border: 2px solid var(--ink);
    background: var(--green-200);
    box-shadow: 3px 4px 0 rgba(21, 27, 41, .12);
  }

  /* Gutter columns on left and right of the corridor */
  .gutter {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .step-num {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    color: var(--ink-2);
    background: #fff;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    width: 25px;
    height: 25px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 28px;
    transition: all .14s ease;
  }

  .step-row.active .step-num {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
    transform: scale(1.08);
  }

  .step-row.is-human.active .step-num {
    background: var(--yellow-300);
    border-color: var(--ink);
    color: var(--ink);
  }

  .step-row.is-host.active .step-num {
    background: var(--green-500);
    border-color: var(--ink);
    color: #fff;
  }

  /* Activation bar SVG on right rail for long-running pending turn */
  .pending-svg {
    position: absolute;
    left: -5px;
    top: 0;
    width: 10px;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  .pending-label {
    font-family: var(--font-title);
    font-size: 10.5px;
    font-weight: 800;
    color: var(--ink);
    background: var(--yellow-200);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 5px 2px;
    writing-mode: vertical-rl;
    letter-spacing: 0.08em;
    margin-left: 28px;
    box-shadow: 2px 2px 0 rgba(21, 27, 41, .08);
  }

  /* Center corridor between the two lifelines: card + arrow inline */
  .corridor {
    display: flex;
    align-items: center;
    padding: 7px 0;
    min-width: 0;
  }

  .step-row.dir-left .corridor {
    flex-direction: row-reverse;
  }

  .stem {
    position: relative;
    flex: 0 0 18px;
    height: 16px;
    display: flex;
    align-items: center;
  }

  .arrow-seg {
    position: relative;
    flex: 1 1 56px;
    min-width: 48px;
    height: 16px;
    display: flex;
    align-items: center;
  }

  .wire-svg {
    width: 100%;
    height: 16px;
    display: block;
    overflow: visible;
  }

  /* Unified message card */
  .msg-card {
    flex: 0 1 auto;
    max-width: 68%;
    min-width: 260px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 15px;
    padding: 10px 14px 11px;
    transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
    text-align: left;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .card-head-main {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .pair-chip {
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 6px;

    background: var(--accent-200);
    border: 1.5px solid rgba(21, 27, 41, .16);
    white-space: nowrap;
  }

  .pair-chip.res {
    color: var(--ink-2);
    background: var(--paper-2);

  }

  .step-row.is-human .pair-chip {

    background: var(--yellow-300);
    border-color: rgba(21, 27, 41, .2);
  }

  .step-row.is-host .pair-chip {

  }

  .method-name {

  .kind-tag {

    font-weight: 700;

  .kind-tag.req {

  .kind-tag.human {

  .kind-tag.host {

  .active-pill {

    font-size: 10px;
    font-weight: 800;

  .card-summary {

  /* Mobile inline JSON drawer (hidden on desktop) */
  .inline-inspector {
    display: none;

  .board-footer {

  /* ── Right: Sticky Inspector (show-me macOS 手绘窗口风格) ── */

  .window-bar {

  .wdot {

  .wdot.r { background: #F26B5E; }
  .wdot.y { background: #F7C948; }

  .wtitle {
    margin-left: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;

  .ins-body {

    padding: 16px 20px 18px;

    flex-direction: column;
    gap: 15px;
  }

  .ins-body > * {
    flex-shrink: 0;
  }

  .ins-explain {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
  }

  .ins-fields {
    display: flex;
    flex-direction: column;
    gap: 7px;
    background: var(--paper-2);

  .ins-fields-title {
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 900;
    color: var(--ink);

  .field-row {
    display: grid;

    gap: 8px 10px;
    align-items: baseline;
    font-size: 12.5px;
  }

  .field-key {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
    background: var(--accent-200);
    padding: 1px 7px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .field-desc {
    color: var(--ink-2);
  }

  /* JSON viewer box */
  .code-card {
    background: var(--code-bg);
    border: 2px solid var(--ink);
    border-radius: 14px;
    overflow: hidden;
  }

  .code-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--code-surface);
    border-bottom: 1px solid var(--code-border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--code-muted);
  }

  .copy-btn {
    border: 1.5px solid #4A5672;
    background: transparent;
    color: #EDF2F7;
    font-family: var(--font-title);
    font-size: 11px;
    font-weight: 800;
    padding: 2px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }

  .copy-btn:hover {
    background: var(--blue-200);
    border-color: var(--blue-200);
    color: var(--ink);
  }

  .copy-btn.copied {
    background: var(--green-200);
    border-color: var(--green-200);
    color: var(--ink);
  }

  .code-pre {
    margin: 0;
    padding: 14px 15px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--code-text);
    overflow-x: auto;
    white-space: pre;
  }

  .code-line {
    display: block;
    padding: 0 5px;
    margin: 0 -5px;
    border-radius: 4px;
  }

  .code-line.hl {
    background: rgba(56, 136, 248, 0.2);
  }

  .a2a .code-line.hl {
    background: rgba(240, 72, 64, 0.2);
  }

  .tok-key  { color: #90C2FF; }
  .tok-str  { color: #9AE6B4; }
  .tok-num  { color: #FBD38D; }
  .tok-bool { color: #D6BCFA; }
  .tok-null { color: #D6BCFA; }

  .ins-foot {
    padding: 12px 18px;
    border-top: 1.5px dashed var(--line);
    background: var(--paper-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .pair-jump {
    border: 1.5px solid var(--ink);
    background: var(--accent-200);
    color: var(--ink);
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease;
  }

  .pair-jump:hover {
    transform: translateY(-1px);
    box-shadow: 2px 2px 0 rgba(21, 27, 41, .12);
  }

  /* ── Compare view (#compare) ── */
  .compare-view {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .matrix-card {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: var(--radius-lg);
    box-shadow: 6px 8px 0 var(--blue-100);
    overflow: hidden;
  }

  .matrix-head {
    padding: 16px 22px;
    border-bottom: 1.5px dashed var(--line);
    background: var(--paper-2);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .matrix-head h2 {
    margin: 0;
    font-family: var(--font-title);
    font-size: 19px;
    font-weight: 900;
  }

  .matrix-head p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-2);
  }

  .matrix-wrap {
    overflow-x: auto;
  }

  .matrix {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  .matrix th,
  .matrix td {
    padding: 12px 18px;
    text-align: left;
    border-bottom: 1px dashed var(--line);
    vertical-align: top;
  }

  .matrix tr:last-child td { border-bottom: 0; }

  .matrix thead th {
    background: #fff;
    border-bottom: 2px solid var(--ink);
    font-family: var(--font-title);
    font-size: 13px;
    font-weight: 900;
    color: var(--ink);
  }

  .matrix thead th.col-acp { background: var(--blue-100); color: var(--blue-deep); }
  .matrix thead th.col-a2a { background: var(--red-100); color: var(--red-deep); }

  .matrix td.dim {
    font-family: var(--font-title);
    font-weight: 800;
    color: var(--ink);
    width: 156px;
    white-space: nowrap;
  }

  .matrix td { color: var(--ink-2); }

  /* Side-by-side stage comparison */
  .stage-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .stage-card {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .stage-card-head {
    padding: 14px 20px;
    background: var(--paper-2);
    border-bottom: 1.5px dashed var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stage-card-head h3 {
    margin: 0;
    font-family: var(--font-title);
    font-size: 16px;
    font-weight: 900;
  }

  .stage-takeaway {
    font-size: 13px;
    color: var(--ink-2);
  }

  .stage-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .stage-col {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;

  .stage-col:first-child {

  .stage-col-label {

    font-size: 12px;
    font-weight: 900;

    padding: 2px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    margin-bottom: 2px;
  }

  .stage-col-label.acp { background: var(--blue-200); color: var(--ink); }
  .stage-col-label.a2a { background: var(--red-200); color: var(--ink); }

  .mini-step {
    width: 100%;

    flex-direction: column;

    transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;

  .mini-step:hover {

  }

  .mini-step.is-sel {

    box-shadow: 3px 3px 0 rgba(21, 27, 41, .1);

  .mini-step.acp {
    --accent-deep: var(--blue-deep);
    --accent-soft: var(--blue-100);
    --accent-border: var(--blue-300);
  }

  .mini-step.a2a {
    --accent-deep: var(--red-deep);
    --accent-soft: var(--red-100);
    --accent-border: var(--red-300);
  }

  .mini-step.acp.is-sel { background: var(--blue-100); }
  .mini-step.a2a.is-sel { background: var(--red-100); }

  .mini-step-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .mini-step-title {
    display: inline-flex;
    align-items: flex-start;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink);
    word-break: break-word;
  }

  .lane-mid-hint .mobile-text { display: none; }

  .mini-dir {
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 800;
  }

  .mini-step p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.55;
  }

  .empty-note {
    padding: 12px 14px;
    border-radius: 13px;
    border: 1.5px dashed var(--human-border);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--yellow-deep);
    background: var(--yellow-100);
  }

  /* ── Responsive ── */
  @media (max-width: 1020px) {
    .intro-strip {
      grid-template-columns: 1fr;
    }
    .intro-facts {
      padding-left: 0;
      padding-top: 14px;

      border-top: 1.5px dashed var(--line);

  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-row">
        <h1><span class="en acp-word">ACP</span><span class="vs">vs</span><span class="en a2a-word">A2A</span><span class="marker">协议时序对照</span></h1>
        <span class="task-pill">同一任务：<strong>「查一下今天天气，写成一句话报告」</strong></span>
      </div>
      <p class="brand-hint">点任意箭头行查看白话解读与原始 JSON，可用 <kbd>↑</kbd> <kbd>↓</kbd> 逐步演练</p>

    <div class="tabs" role="tablist" aria-label="视图切换">
      <button type="button" data-tab="acp" class="on" role="tab" aria-selected="true"><span class="dot"></span>ACP 本地白盒</button>
      <button type="button" data-tab="a2a" role="tab" aria-selected="false"><span class="dot"></span>A2A 远程黑盒</button>
      <button type="button" data-tab="compare" role="tab" aria-selected="false"><span class="dot"></span>同阶段对照</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
const TASK_TEXT = "查一下今天天气，写成一句话报告";

const PROTOCOLS = {
  acp: {
    key: "acp",
    tag: "ACP",

Object.values(PROTOCOLS).forEach((p) => {
  p.sections.forEach((sec) => {
    sec.steps.forEach((st) => {
      STEP_BY_UID[st.uid] = {
        ...st,
        protoKey: p.key,
        sectionNo: sec.no,

        scenarioKey: null
      };
    });
  });
  if (p.scenarios) {
    p.scenarios.forEach((sc) => {
      sc.steps.forEach((st) => {
        STEP_BY_UID[st.uid] = {
          ...st,
          protoKey: p.key,
          sectionNo: "04",
          sectionTitle: "经典场景 · " + sc.shortTitle,
          scenarioKey: sc.key
        };
      });

});

function getVisibleSteps(protoKey) {
  const p = PROTOCOLS[protoKey];
  const list = [];
  p.sections.forEach((sec) => {
    sec.steps.forEach((st) => list.push(STEP_BY_UID[st.uid]));
  });
  if (p.scenarios && p.scenarios.length) {
    const activeScKey = state.scenario[protoKey] || p.scenarios[0].key;
    const sc = p.scenarios.find((x) => x.key === activeScKey) || p.scenarios[0];
    sc.steps.forEach((st) => list.push(STEP_BY_UID[st.uid]));
  }
  return list;
}

function getStepIndexMap(list) {
  const map = {};
  list.forEach((s, i) => { map[s.uid] = i + 1; });
  return map;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlightJsonLines(obj, highlightKeys = []) {
  const raw = JSON.stringify(obj, null, 2);
  const keySet = new Set(highlightKeys);
  return raw.split("\n").map((line) => {
    let isHl = false;
    for (const k of keySet) {
      if (line.includes('"' + k + '":') || line.includes('"' + k + '"')) {
        if (line.includes('"' + k + '":') || k === "max") {
          isHl = true;
          break;
        }
      }
    }
    const colored = esc(line).replace(
      /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      (m) => {
        let cls = "tok-num";
        if (m.startsWith('"')) cls = m.trimEnd().endsWith(":") ? "tok-key" : "tok-str";
        else if (m === "true" || m === "false") cls = "tok-bool";
        else if (m === "null") cls = "tok-null";
        return '<span class="' + cls + '">' + m + "</span>";
      }
    );
    return '<span class="code-line' + (isHl ? " hl" : "") + '">' + colored + "</span>";
  }).join("");
}

function pendingSvgHtml(mode) {
  if (!mode) return "";
  const fill = "#D0E8F8";
  const stroke = "#151B29";
  if (mode === "start") {
    return (
      '<svg class="pending-svg" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true">' +
        '<rect x="1" y="50" width="8" height="50" fill="' + fill + '" />' +
        '<path d="M1 100 V50 H9 V100" fill="none" stroke="' + stroke + '" stroke-width="1.6" vector-effect="non-scaling-stroke" />' +
      "</svg>"
    );
  }
  if (mode === "end") {
    return (
      '<svg class="pending-svg" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true">' +
        '<rect x="1" y="0" width="8" height="50" fill="' + fill + '" />' +
        '<path d="M1 0 V50 H9 V0" fill="none" stroke="' + stroke + '" stroke-width="1.6" vector-effect="non-scaling-stroke" />' +
      "</svg>"
    );
  }
  return (
    '<svg class="pending-svg" viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<rect x="1" y="0" width="8" height="100" fill="' + fill + '" />' +
      '<line x1="1" y1="0" x2="1" y2="100" stroke="' + stroke + '" stroke-width="1.6" vector-effect="non-scaling-stroke" />' +
      '<line x1="9" y1="0" x2="9" y2="100" stroke="' + stroke + '" stroke-width="1.6" vector-effect="non-scaling-stroke" />' +
    "</svg>"
  );
}

function wireColors(step) {
  const isDashed = step.kindType === "res" || step.kindType === "notify";
  const color = step.human
    ? "var(--yellow-deep)"
    : (step.host ? "var(--green-500)" : (isDashed ? "var(--ink-2)" : "var(--accent)"));
  return { color, dashAttr: isDashed ? ' stroke-dasharray="5 5"' : "" };
}

function stemSvgHtml(step) {
  const { color, dashAttr } = wireColors(step);
  const dotSide = step.dir === "right" ? "left:-4.5px" : "right:-4.5px";
  return (
    '<svg class="wire-svg" viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true">' +
      '<line x1="0" y1="8" x2="100" y2="8" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"' + dashAttr + ' />' +
    "</svg>" +
    '<svg style="position:absolute;' + dotSide + ';top:3.5px;width:9px;height:9px;overflow:visible" viewBox="0 0 9 9" aria-hidden="true"><circle cx="4.5" cy="4.5" r="3.4" fill="' + color + '" stroke="#151B29" stroke-width="1.1"/></svg>'
  );
}

  );
}

function findPairStep(step, visibleList) {
  if (!step.pair) return null;
  const pool = visibleList || Object.values(STEP_BY_UID).filter(
    (s) => s.protoKey === step.protoKey && s.scenarioKey === step.scenarioKey
  );
  return pool.find((s) => s.uid !== step.uid && s.pair === step.pair) || null;
}

function kindClassOf(step) {
  if (step.human) return "human";
  if (step.host) return "host";
  return step.kindType === "req" ? "req" : "";
}

function inspectorInnerHtml(step, options = {}) {
  const p = PROTOCOLS[step.protoKey];
  const from = step.dir === "right" ? p.actors[0].name : p.actors[1].name;
  const to = step.dir === "right" ? p.actors[1].name : p.actors[0].name;
  const list = options.visibleList || getVisibleSteps(step.protoKey);
  const idxMap = getStepIndexMap(list);
  const curIdx = idxMap[step.uid];
  const pairTarget = findPairStep(step, options.visibleList ? list : null);
  const showNav = options.showNav !== false;

  const fieldsHtml = step.fields && step.fields.length
    ? '<div class="ins-fields">' +
        '<div class="ins-fields-title">看懂这份 JSON 的关键字段</div>' +
        step.fields.map((f) =>
          '<div class="field-row"><span class="field-key">' + esc(f.k) + '</span><span class="field-desc">' + esc(f.d) + "</span></div>"
        ).join("") +
      "</div>"
    : "";

  const pairBtn = pairTarget && showNav
    ? '<button type="button" class="pair-jump" data-jump-uid="' + pairTarget.uid + '">跳到配对的' + (pairTarget.res ? "响应" : "请求") + "（第 " + idxMap[pairTarget.uid] + " 步）</button>"
    : '<span></span>';

  const navHtml = showNav
    ? '<div class="ins-foot">' +
        pairBtn +
        '<div class="stepper">' +
          '<button type="button" class="step-btn" data-nav="prev"' + (curIdx <= 1 ? " disabled" : "") + ">← 上一步</button>" +
          '<button type="button" class="step-btn" data-nav="next"' + (curIdx >= list.length ? " disabled" : "") + ">下一步 →</button>" +
        "</div>" +
      "</div>"
    : "";

  const routeProgress = curIdx
    ? esc(p.tag) + " · " + curIdx + "/" + list.length + " · " + esc(step.sectionTitle)
    : esc(p.tag) + " · " + esc(step.sectionTitle);

  return (
    '<div class="window-bar">' +
      '<span class="wdot r"></span><span class="wdot y"></span><span class="wdot g"></span>' +
      '<span class="wtitle">' + routeProgress + "</span>" +
      '<span class="ins-direction">' + esc(from) + " → " + esc(to) + "</span>" +
    "</div>" +
    '<div class="ins-head">' +
      '<div class="ins-title-line">' +
        (step.pair ? '<span class="pair-chip' + (step.res ? " res" : "") + '">' + (step.res ? "↳ " : "") + esc(step.pair) + "</span>" : "") +
        '<h3 class="ins-method">' + esc(step.method) + "</h3>" +
        '<span class="kind-tag ' + kindClassOf(step) + '">' + esc(step.kind) + "</span>" +
      "</div>" +
    "</div>" +
    '<div class="ins-body">' +
      '<p class="ins-explain">' + esc(step.why) + "</p>" +
      fieldsHtml +
      '<div class="code-card">' +
        '<div class="code-bar">' +
          '<span>RAW JSON · 浅亮行为重点字段</span>' +
          '<button type="button" class="copy-btn" data-copy-uid="' + step.uid + '">复制 JSON</button>' +
        "</div>" +
        '<pre class="code-pre code-scroll">' + highlightJsonLines(step.json, step.highlightKeys) + "</pre>" +
      "</div>" +
    "</div>" +
    navHtml
  );
}

        '<button type="button" class="copy-btn" data-copy-uid="' + step.uid + '">复制</button>' +
      "</div>" +
      '<div style="padding:10px 14px 4px;font-size:12.5px;color:#c9d1df;line-height:1.55">' + esc(step.why) + "</div>" +
      '<pre class="code-pre code-scroll">' + highlightJsonLines(step.json, step.highlightKeys) + "</pre>" +
    "</div>"
  );
}

function computePendingLabelMap(steps) {
  const labelMap = {};
  let runStart = -1;
  let runLabel = "";
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    if (s.pending === "start") {
      runStart = i;
      runLabel = s.pendingLabel || (s.pair ? s.pair + " 挂起中" : "挂起中");
    } else if (s.pending === "end" && runStart >= 0) {
      const midIdx = Math.floor((runStart + i) / 2);
      labelMap[steps[midIdx].uid] = runLabel;
      runStart = -1;
      runLabel = "";
    }
  }
  return labelMap;
}

function renderStepRows(rawSteps, idxMap, activeUid, pairOfActive) {
  const pendingLabels = computePendingLabelMap(rawSteps);
  return rawSteps.map((raw) => {
    const step = STEP_BY_UID[raw.uid];
    const isActive = step.uid === activeUid;
    const isPaired = !isActive && pairOfActive && step.pair === pairOfActive;
    const classes = [
      "step-row",
      step.dir === "left" ? "dir-left" : "dir-right",
      isActive ? "active" : "",
      isPaired ? "paired" : "",
      step.human ? "is-human" : "",
      step.host ? "is-host" : ""
    ].filter(Boolean).join(" ");

    const pendingSvg = pendingSvgHtml(step.pending);
    const pendingTag = pendingLabels[step.uid]
      ? '<span class="pending-label">' + esc(pendingLabels[step.uid]) + "</span>"
      : "";
    const kindCls = kindClassOf(step);

    return (
      '<button type="button" class="' + classes + '" data-uid="' + step.uid + '" aria-pressed="' + (isActive ? "true" : "false") + '">' +
        '<div class="gutter left"><span class="step-num">' + idxMap[step.uid] + "</span></div>" +
        '<div class="corridor">' +
          '<span class="stem">' + stemSvgHtml(step) + "</span>" +
          '<div class="msg-card">' +
            '<div class="card-head">' +
              '<div class="card-head-main">' +
                (step.pair ? '<span class="pair-chip' + (step.res ? " res" : "") + '">' + (step.res ? "↳ " : "") + esc(step.pair) + "</span>" : "") +
                '<span class="method-name">' + esc(step.method) + "</span>" +
                '<span class="kind-tag ' + kindCls + '">' + esc(step.kind) + "</span>" +
              "</div>" +
              (isActive ? '<span class="active-pill">JSON</span>' : "") +
            "</div>" +
            '<p class="card-summary">' + esc(step.short) + "</p>" +
          "</div>" +
          '<span class="arrow-seg">' + arrowSegSvgHtml(step) + "</span>" +
        "</div>" +
        '<div class="gutter right">' + pendingSvg + pendingTag + "</div>" +
      "</button>" +
      inlineMobileInspectorHtml(step)
    );
  }).join("");
}

function renderProtocolView(key) {
  const p = PROTOCOLS[key];
  const list = getVisibleSteps(key);
  const idxMap = getStepIndexMap(list);
  let activeUid = state.selected[key];
  if (!idxMap[activeUid]) {
    activeUid = list[0].uid;
    state.selected[key] = activeUid;
  }
  const activeStep = STEP_BY_UID[activeUid];
  const activeIdx = idxMap[activeUid];
  const pairOfActive = activeStep.pair ? activeStep.pair : null;

  const sectionsHtml = p.sections.map((sec) => {
    const stepsHtml = renderStepRows(sec.steps, idxMap, activeUid, pairOfActive);
    return (
      '<section class="phase' + (sec.branch ? " branch" : "") + '">' +
        '<div class="phase-header">' +
          '<div class="phase-title-group">' +
            '<span class="phase-no">' + esc(sec.no) + "</span>" +
            '<h3 class="phase-title">' + esc(sec.title) + "</h3>" +
            (sec.branch ? '<span class="phase-tag">可选分支</span>' : "") +
          "</div>" +
          '<p class="phase-desc">' + esc(sec.desc) + "</p>" +
        "</div>" +
        stepsHtml +
      "</section>"
    );
  }).join("");

  let scenariosHtml = "";
  if (p.scenarios && p.scenarios.length) {
    const activeScKey = state.scenario[key] || p.scenarios[0].key;
    const activeSc = p.scenarios.find((s) => s.key === activeScKey) || p.scenarios[0];
    const pillsHtml = p.scenarios.map((sc) => {
      const on = sc.key === activeSc.key;
      return (
        '<button type="button" class="scenario-pill' + (on ? " on" : "") + '" data-scenario-proto="' + key + '" data-scenario-key="' + sc.key + '" aria-pressed="' + (on ? "true" : "false") + '">' +
          esc(sc.shortTitle) +
          '<span class="scenario-count">' + sc.steps.length + "</span>" +
        "</button>"
      );
    }).join("");

    scenariosHtml =
      '<section class="phase scenarios">' +
        '<div class="phase-header">' +
          '<div class="phase-header-top">' +
            '<div class="phase-title-group">' +
              '<span class="phase-no">04</span>' +
              '<h3 class="phase-title">经典扩展与分支场景 · ' + esc(activeSc.title) + "</h3>" +
              '<span class="phase-tag">点击胶囊切换场景</span>' +
            "</div>" +
          "</div>" +
          '<div class="scenario-bar" role="group" aria-label="ACP 经典场景切换">' + pillsHtml + "</div>" +
          '<p class="scenario-brief">' + activeSc.brief + "</p>" +
        "</div>" +
        renderStepRows(activeSc.steps, idxMap, activeUid, pairOfActive) +
      "</section>";
  }

  return (
    '<div class="proto-view ' + key + '" id="view-' + key + '"' + (state.tab !== key ? " hidden" : "") + ">" +
      '<section class="intro-strip">' +
        '<div class="intro-main">' +
          '<div class="intro-title-row">' +
            '<span class="proto-badge">' + esc(p.tag) + "</span>" +
            "<h2>" + esc(p.name) + "</h2>" +
            '<span class="intro-meta">' + esc(p.transport) + "</span>" +
          "</div>" +
          '<p class="mental-model">' + p.mentalModel + "</p>" +
        "</div>" +
        '<div class="intro-facts">' +
          p.facts.map((f) => '<div class="fact"><span class="fact-label">' + esc(f.label) + '</span><span class="fact-val">' + esc(f.val) + "</span></div>").join("") +
        "</div>" +
      "</section>" +
      '<div class="workspace">' +
        '<div class="seq-board">' +
          '<div class="seq-toolbar">' +
            '<div class="legend-inline">' +
              '<span class="legend-item"><span class="legend-line"></span>发起请求</span>' +
              '<span class="legend-item"><span class="legend-line dashed"></span>响应 / 流式通知</span>' +
              '<span class="legend-item"><span class="legend-line human"></span>人工干预</span>' +
              (key === "acp" ? '<span class="legend-item"><span class="legend-line host"></span>宿主能力委托</span>' : "") +
            "</div>" +
            '<div class="stepper">' +
              '<button type="button" class="step-btn" data-nav="prev" data-proto="' + key + '"' + (activeIdx <= 1 ? " disabled" : "") + ">← 上一步</button>" +
              '<span class="step-counter">' + activeIdx + " / " + list.length + "</span>" +
              '<button type="button" class="step-btn" data-nav="next" data-proto="' + key + '"' + (activeIdx >= list.length ? " disabled" : "") + ">下一步 →</button>" +
            "</div>" +
          "</div>" +
          '<div class="lane-header">' +
            '<div class="actor-box"><span class="actor-name">' + esc(p.actors[0].name) + '</span><span class="actor-role">' + esc(p.actors[0].role) + "</span></div>" +
            '<div class="lane-mid-hint"><span class="desktop-text">点击任意箭头行，右侧同步显示报文</span><span class="mobile-text">点击任意行展开报文</span></div>' +
            '<div class="actor-box agent"><span class="actor-name">' + esc(p.actors[1].name) + '</span><span class="actor-role">' + esc(p.actors[1].role) + "</span></div>" +
          "</div>" +
          '<div class="diagram-body">' +
            '<div class="rails"><i class="rail-line left"></i><i class="rail-line right"></i></div>' +
            sectionsHtml +
            scenariosHtml +
            '<div class="board-footer">' + p.footnote + "</div>" +
          "</div>" +
        "</div>" +
        '<aside class="inspector" aria-label="报文详情检视器">' +
          inspectorInnerHtml(activeStep, { visibleList: list }) +
        "</aside>" +
      "</div>" +
    "</div>"
  );
}

function renderCompareView() {
  const cStep = STEP_BY_UID[state.compareUid];
  const isA2a = cStep.protoKey === "a2a";

  const matrixHtml =
    '<section class="matrix-card">' +
      '<div class="matrix-head">' +
        "<h2>8 维核心差异速查</h2>" +
        "<p>一句话记法：ACP 是「管本地助手的操作台协议」，A2A 是「调外部服务的协作协议」</p>" +
      "</div>" +
      '<div class="matrix-wrap">' +
        '<table class="matrix">' +
          '<thead><tr><th>对比维度</th><th class="col-acp">ACP（Agent Client Protocol）</th><th class="col-a2a">A2A（Agent2Agent）</th></tr></thead>' +
          "<tbody>" +
            COMPARE_MATRIX.map((r) =>
              '<tr><td class="dim">' + esc(r.dim) + "</td><td>" + esc(r.acp) + "</td><td>" + esc(r.a2a) + "</td></tr>"
            ).join("") +
          "</tbody>" +
        "</table>" +
      "</div>" +
    "</section>";

  const stagesHtml = COMPARE_STAGES.map((st) => {
    const renderCol = (uids, protoKey, label, extraNote) => {
      const items = uids.map((uid) => {
        const s = STEP_BY_UID[uid];
        const isSel = state.compareUid === uid;
        return (
          '<button type="button" class="mini-step ' + protoKey + (isSel ? " is-sel" : "") + '" data-compare-uid="' + uid + '">' +
            '<div class="mini-step-top">' +
              '<span class="mini-step-title">' +
                '<span class="mini-dir">' + (s.dir === "right" ? "→" : "←") + "</span>" +
                esc(s.method) +
              "</span>" +
              '<span class="kind-tag ' + kindClassOf(s) + '">' + esc(s.kind) + "</span>" +
            "</div>" +
            "<p>" + esc(s.short) + "</p>" +
          "</button>"
        );
      }).join("");
      const noteHtml = extraNote ? '<div class="empty-note">' + esc(extraNote) + "</div>" : "";
      return (
        '<div class="stage-col">' +
          '<div class="stage-col-label ' + protoKey + '">' + label + "</div>" +
          noteHtml +
          items +
        "</div>"
      );
    };

    return (
      '<article class="stage-card">' +
        '<div class="stage-card-head">' +
          "<h3>" + esc(st.title) + "</h3>" +
          '<span class="stage-takeaway">' + esc(st.takeaway) + "</span>" +
        "</div>" +
        '<div class="stage-cols">' +
          renderCol(st.acpUids, "acp", "ACP · 本地白盒", st.acpNote) +
          renderCol(st.a2aUids, "a2a", "A2A · 远程黑盒", st.a2aNote) +
        "</div>" +
      "</article>"
    );
  }).join("");

  return (
    '<div class="compare-view" id="view-compare"' + (state.tab !== "compare" ? " hidden" : "") + ">" +
      matrixHtml +
      '<div class="workspace">' +
        '<div class="stage-list">' + stagesHtml + "</div>" +
        '<aside class="inspector proto-view ' + (isA2a ? "a2a" : "acp") + '" style="display:flex" aria-label="对照报文检视器">' +
          inspectorInnerHtml(cStep, { showNav: false }) +
          '<div class="ins-foot">' +
            '<span style="font-size:12px;color:var(--ink-3)">点击左侧任一协议卡片即可切换报文</span>' +
            '<button type="button" class="pair-jump" data-open-full="' + cStep.uid + '">在完整时序图中定位 →</button>' +
          "</div>" +
        "</aside>" +
      "</div>" +
    "</div>"
  );
}

function render() {
  document.getElementById("app").innerHTML =
    renderProtocolView("acp") +
    renderProtocolView("a2a") +
    renderCompareView();

  document.querySelectorAll(".tabs button").forEach((b) => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
}

function setTab(tab, scrollTop = false) {
  state.tab = ["acp", "a2a", "compare"].includes(tab) ? tab : "acp";
  history.replaceState(null, "", "#" + state.tab);
  render();
  if (scrollTop) window.scrollTo({ top: 0, behavior: "instant" });
}

function selectStep(uid, shouldScroll = false) {
  const st = STEP_BY_UID[uid];
  if (!st) return;
  if (st.scenarioKey) {
    state.scenario[st.protoKey] = st.scenarioKey;
  }
  state.selected[st.protoKey] = uid;
  render();
  if (shouldScroll) {
    const el = document.querySelector('.step-row[data-uid="' + uid + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function selectScenario(protoKey, scenarioKey) {
  const p = PROTOCOLS[protoKey];
  if (!p || !p.scenarios) return;
  const sc = p.scenarios.find((s) => s.key === scenarioKey);
  if (!sc) return;
  state.scenario[protoKey] = scenarioKey;
  if (sc.steps.length) {
    state.selected[protoKey] = sc.steps[0].uid;
  }
  render();
}

function stepRelative(delta) {
  if (state.tab !== "acp" && state.tab !== "a2a") return;
  const list = getVisibleSteps(state.tab);
  const curIdx = list.findIndex((s) => s.uid === state.selected[state.tab]);
  const nextIdx = (curIdx < 0 ? 0 : curIdx) + delta;
  if (nextIdx < 0 || nextIdx >= list.length) return;
  selectStep(list[nextIdx].uid, true);
}

/* Event delegation */
document.querySelector(".tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn || btn.dataset.tab === state.tab) return;
  setTab(btn.dataset.tab, true);
});

document.getElementById("app").addEventListener("click", (e) => {
  const copyBtn = e.target.closest("button[data-copy-uid]");
  if (copyBtn) {
    e.stopPropagation();
    const st = STEP_BY_UID[copyBtn.dataset.copyUid];
    if (st && navigator.clipboard) {
      navigator.clipboard.writeText(JSON.stringify(st.json, null, 2)).then(() => {
        copyBtn.textContent = "已复制";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "复制 JSON";
          copyBtn.classList.remove("copied");
        }, 1400);
      });
    }
    return;
  }

  const scenarioBtn = e.target.closest("button[data-scenario-key]");
  if (scenarioBtn) {
    selectScenario(scenarioBtn.dataset.scenarioProto, scenarioBtn.dataset.scenarioKey);
    return;
  }

  const jumpBtn = e.target.closest("button[data-jump-uid]");
  if (jumpBtn) {
    selectStep(jumpBtn.dataset.jumpUid, true);
    return;
  }

  const openFullBtn = e.target.closest("button[data-open-full]");
  if (openFullBtn) {
    const st = STEP_BY_UID[openFullBtn.dataset.openFull];
    if (st) {
      if (st.scenarioKey) {
        state.scenario[st.protoKey] = st.scenarioKey;
      }
      state.selected[st.protoKey] = st.uid;
      setTab(st.protoKey, false);
      setTimeout(() => {
        const el = document.querySelector('.step-row[data-uid="' + st.uid + '"]');
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 30);
    }
    return;
  }

  const navBtn = e.target.closest("button[data-nav]");
  if (navBtn) {
    stepRelative(navBtn.dataset.nav === "next" ? 1 : -1);
    return;
  }

  const compareCard = e.target.closest("button[data-compare-uid]");
  if (compareCard) {
    state.compareUid = compareCard.dataset.compareUid;
    render();
    return;
  }

  const stepRow = e.target.closest("button.step-row[data-uid]");
  if (stepRow) {
    selectStep(stepRow.dataset.uid, false);
  }
});

/* Keyboard stepping */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowDown" || e.key === "j") {
    if (state.tab === "acp" || state.tab === "a2a") {
      e.preventDefault();
      stepRelative(1);
    }
  } else if (e.key === "ArrowUp" || e.key === "k") {
    if (state.tab === "acp" || state.tab === "a2a") {
      e.preventDefault();
      stepRelative(-1);
    }
  }
});

function syncTopbarHeight() {
  const tb = document.querySelector(".topbar");
  if (tb) {
    document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
  }
}

window.addEventListener("resize", syncTopbarHeight);
syncTopbarHeight();

const initialHash = location.hash.replace("#", "");
setTab(["acp", "a2a", "compare"].includes(initialHash) ? initialHash : "acp", false);
</script>
</body>
</html>
